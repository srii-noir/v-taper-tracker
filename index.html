<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>V-Taper AI Tracker</title>
  <style>
    :root { --bg: #0f0f11; --surface: #1a1a1e; --accent: #00ffcc; --text: #e0e0e0; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
    
    /* Heads Up Display (HUD) */
    .hud { background: var(--surface); padding: 20px; text-align: center; border-bottom: 1px solid #333; z-index: 10; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    .hud h2 { margin: 0 0 10px 0; color: var(--accent); font-size: 1.2rem; letter-spacing: 2px; }
    .status-bars { display: flex; justify-content: space-between; font-size: 0.85rem; font-weight: bold; color: #aaa; }
    .status-item span { color: #fff; font-size: 1.1rem; display: block; margin-top: 5px; }

    /* Chat Area */
    .chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
    .msg { max-width: 85%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; font-size: 0.95rem; }
    .msg-user { background: #2a2a2e; align-self: flex-end; color: #fff; border-bottom-right-radius: 2px; }
    .msg-ai { background: rgba(0,255,204,0.08); border: 1px solid rgba(0,255,204,0.2); align-self: flex-start; color: var(--accent); border-bottom-left-radius: 2px; }
    
    /* Input Area */
    .input-area { padding: 15px; background: var(--surface); display: flex; gap: 10px; border-top: 1px solid #333; }
    input { flex: 1; padding: 14px; background: #2a2a2e; border: 1px solid #444; color: white; border-radius: 8px; font-size: 1rem; }
    button { padding: 14px 24px; background: var(--accent); color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
  </style>
</head>
<body>

  <div class="hud">
    <h2>V-TAPER AI</h2>
    <div class="status-bars">
      <div class="status-item">Habits Completed <span id="scoreDisplay">0 / 8</span></div>
      <div class="status-item">Calories Logged <span id="calDisplay">0 / 2900</span></div>
    </div>
  </div>

  <div class="chat-container" id="chat">
    <div class="msg msg-ai"><strong>Coach:</strong> I'm monitoring your V-Taper plan. Just tell me what you eat or when you train, and I'll update your dashboard automatically. What have you done so far today?</div>
  </div>

  <div class="input-area">
    <input type="text" id="input" placeholder="e.g., 'I just did my workout and ate the dates'" onkeypress="if(event.key==='Enter') send()">
    <button onclick="send()">Log</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // 1. PASTE YOUR FIREBASE CONFIG HERE
    const firebaseConfig = {
  apiKey: "AIzaSyBnuz6fGxVfXL1GMZMVy_U0DmOpQ4AonKo",
  authDomain: "mass-tracker-dbf8d.firebaseapp.com",
  projectId: "mass-tracker-dbf8d",
  storageBucket: "mass-tracker-dbf8d.firebasestorage.app",
  messagingSenderId: "226027662295",
  appId: "1:226027662295:web:bcdc9bfa423f31794ff992",
  measurementId: "G-7KSD9NKG8C"
};


    // 2. SECURE GEMINI KEY
    let GEMINI_API_KEY = localStorage.getItem("gemini_key");
    if (!GEMINI_API_KEY) {
      GEMINI_API_KEY = prompt("Enter your Gemini API Key to activate the AI Tracker:");
      if (GEMINI_API_KEY) localStorage.setItem("gemini_key", GEMINI_API_KEY);
    }

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    // New database document so we don't clash with the old checklist format
    const docRef = doc(db, "users", "srii_ai_tracker"); 

    const taskNames = [
      "2 Bananas", "Aesthetic Workout", "4 Boiled Eggs", 
      "Mass Shake", "7-8 Dates", "Lunch (Rice/Chicken)", 
      "Dinner (Chapathi/Chicken)", "Mixed Nuts"
    ];

    let state = {
      checklist: Array(8).fill(false),
      calories: 0,
      date: new Date().toDateString()
    };

    // Cloud Sync & Auto-Reset
    onSnapshot(docRef, (docSnap) => {
      if (docSnap.exists()) {
        const data = docSnap.data();
        if(data.date !== new Date().toDateString()) {
            state = { checklist: Array(8).fill(false), calories: 0, date: new Date().toDateString() };
            saveState();
        } else {
            state = data;
        }
        updateHUD();
      } else {
        saveState();
      }
    });

    function saveState() { setDoc(docRef, state); }

    function updateHUD() {
      const completed = state.checklist.filter(Boolean).length;
      document.getElementById('scoreDisplay').innerText = `${completed} / 8`;
      document.getElementById('calDisplay').innerText = `${state.calories} / 2900`;
    }

    window.send = async function() {
      const input = document.getElementById('input');
      const text = input.value.trim();
      if (!text) return;

      addMsg(text, 'msg-user');
      input.value = '';
      
      // Briefly show a typing indicator
      const typingId = "typing-" + Date.now();
      addMsg("Analyzing entry...", 'msg-ai', typingId);

      // Build context for the AI
      const currentState = taskNames.map((name, i) => `"${name}": ${state.checklist[i]}`).join(', ');

      const prompt = `You are an aggressive aesthetic bodybuilding coach tracking a user's 2900-calorie V-Taper plan. 
      Current habit states: { ${currentState} }. Current daily calories: ${state.calories}.
      
      The user just said: "${text}"

      Figure out which of the 8 habits they just completed. 
      If they ate something off-plan (like a snack or extra meal), estimate the calories and add it to the total.
      If they completed a habit, estimate the standard calories for that habit and add it to the total.

      Respond ONLY with a JSON object matching this exact schema:
      {
        "reply": "Your brief, conversational reply confirming what was logged.",
        "updatedChecklist": [boolean, boolean, boolean, boolean, boolean, boolean, boolean, boolean], 
        "totalCalories": number
      }`;

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ 
              contents: [{ parts: [{ text: prompt }] }],
              // Force Gemini to output pure JSON
              generationConfig: { responseMimeType: "application/json" }
          })
        });
        
        const data = await res.json();
        const result = JSON.parse(data.candidates[0].content.parts[0].text);
        
        // Remove typing indicator
        document.getElementById(typingId).remove();
        
        // Apply updates to Firebase
        state.checklist = result.updatedChecklist;
        state.calories = result.totalCalories;
        saveState();
        
        addMsg(result.reply, 'msg-ai');
        
      } catch(e) {
        document.getElementById(typingId).remove();
        addMsg("Connection error. Ensure your API key is valid.", 'msg-ai');
      }
    }

    function addMsg(text, type, id = null) {
      const chat = document.getElementById('chat');
      const div = document.createElement('div');
      div.className = `msg ${type}`;
      if (id) div.id = id;
      div.innerHTML = `<strong>${type === 'msg-user' ? 'You' : 'Coach'}:</strong> <br>${text}`;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }
  </script>
</body>
</html>
